name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        emacs_version: ['29.1', '30.1']
    steps:
      - uses: actions/checkout@v4
      - uses: purcell/setup-emacs@master
        with:
          version: ${{ matrix.emacs_version }}
      - name: Fetch eat and persp-mode for the suites that use them
        run: |
          git clone --quiet --depth 1 --branch v0.9.4 https://codeberg.org/akib/emacs-eat "$RUNNER_TEMP/eat"
          git clone --quiet --depth 1 --branch v3.0.9 https://github.com/Bad-ptr/persp-mode.el "$RUNNER_TEMP/persp-mode"
      - name: Byte-compile and test
        env:
          TERRA_EMACS_TEST_LOAD_PATH: ${{ runner.temp }}/eat:${{ runner.temp }}/persp-mode
        run: make test
